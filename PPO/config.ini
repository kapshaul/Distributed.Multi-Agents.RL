[ENVIRONMENT]
# Available Environments:
# - Classic Control: CartPole-v1, MountainCar-v0, Acrobot-v1
# - Atari: SpaceInvaders-v4, ALE/Adventure-v5, ALE/Alien-v5

env_id = SpaceInvaders-v4
render = 0
seed = 42

[MODEL]
hidden_size = 2000

[PPO]
lambda = 0.95
ppo_epochs = 10
ppo_clip_eps = 0.2
value_coef = 0.5
entropy_coef = 0.1

[TRAINING]
learning_rate = 1e-4
batch_size = 512
gamma = 0.99
evaluation_episodes = 5
num_iterations = 20
max_train_steps = 10_000_000
max_episode_steps = 1_000_000

